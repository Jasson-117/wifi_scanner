<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Wi-Fi Radar</title>
<style>
  :root {
    color-scheme: light dark;
    font-family: system-ui, sans-serif;
    --good: #2e9e4f; --ok: #1e7ad9; --warn: #d98a00; --bad: #d9372b; --none: #888;
  }
  body { margin: 0; padding: 16px; max-width: 1100px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin-top: 0; }
  h2 { font-size: .85rem; margin: 0 0 4px; opacity: .7; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  button { font: inherit; }
  .btn { padding: 8px 16px; font-size: 1rem; border-radius: 6px; border: 1px solid #888; cursor: pointer; background: transparent; color: inherit; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  #scan { background: #1976d2; color: #fff; border-color: #1976d2; }

  /* Resumen / filtros */
  #summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .group { border: 1px solid #8884; border-radius: 8px; padding: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { cursor: pointer; border-radius: 999px; padding: 3px 10px; font-size: .85rem;
          border: 1px solid var(--c, var(--none)); background: color-mix(in srgb, var(--c, var(--none)) 15%, transparent);
          color: inherit; }
  .chip.active { background: var(--c, var(--none)); color: #fff; }
  .good { --c: var(--good); } .ok { --c: var(--ok); } .warn { --c: var(--warn); } .bad { --c: var(--bad); }

  /* Tabla */
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { padding: 6px 10px; border-bottom: 1px solid #8884; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: Canvas; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: .8rem;
           border: 1px solid var(--c, var(--none)); background: color-mix(in srgb, var(--c, var(--none)) 18%, transparent); }
  .meter { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: #8883; margin-right: 6px; vertical-align: middle; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--c, var(--none)); }
  .muted { opacity: .6; }

  /* Congestión */
  #congestion { border: 1px solid #8884; border-radius: 8px; padding: 10px; margin-bottom: 14px; }
  #congestion svg { width: 100%; height: auto; display: block; }
  .rec { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .9rem; }
  .note { font-size: .8rem; opacity: .65; margin: 8px 0 0; }

  /* Historial */
  #stats .group { margin-bottom: 12px; }
  #stats svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; margin-top: 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  select { font: inherit; padding: 6px; border-radius: 6px; }
</style>
</head>
<body>
<h1>Wi-Fi Radar (ESP32-S3)</h1>

<div class="bar">
  <button class="btn" id="scan">Iniciar escaneo</button>
  <button class="btn" id="csv" disabled>Descargar CSV</button>
  <label>Auto: <select id="auto">
    <option value="0">Apagado</option><option value="10">cada 10 s</option>
    <option value="30">cada 30 s</option><option value="60">cada 1 min</option>
  </select></label>
  <span id="status"></span>
  <span id="histInfo" class="muted"></span>
</div>

<div id="summary"></div>

<div id="congestion" hidden></div>

<div id="stats" hidden></div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>SSID</th><th>BSSID</th><th title="Canal principal (entre paréntesis el canal secundario si usa 40 MHz)">Canal</th><th>RSSI</th><th>Señal</th>
        <th>Seguridad</th><th>Ancho</th><th>Estándar</th><th>Notas</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------------- Reglas de clasificación ---------------- */
const SEC = {
  'OPEN':          { label: 'Abierta',   level: 'bad',  note: 'Sin cifrado' },
  'WEP':           { label: 'WEP',       level: 'bad',  note: 'Obsoleta e insegura' },
  'WPA_PSK':       { label: 'WPA',       level: 'warn', note: 'Antigua, débil' },
  'WPA/WPA2_PSK':  { label: 'WPA/WPA2',  level: 'warn', note: 'Modo mixto por compatibilidad' },
  'WPA2_PSK':      { label: 'WPA2',      level: 'ok',   note: 'Estándar actual' },
  'WPA2/WPA3_PSK': { label: 'WPA2/WPA3', level: 'good', note: 'Transición a WPA3' },
  'WPA3_PSK':      { label: 'WPA3',      level: 'good', note: 'La más segura (personal)' },
  'OWE':           { label: 'OWE',       level: 'good', note: 'Abierta pero con cifrado' },
  'WPA3_ENT_192':  { label: 'WPA3-Ent',  level: 'good', note: 'Empresarial 192 bits' },
  'WAPI_PSK':      { label: 'WAPI',      level: 'ok',   note: 'Estándar chino WAPI' }
};

function signalClass(rssi) {
  if (rssi >= -50) return { label: 'Excelente', level: 'good' };
  if (rssi >= -60) return { label: 'Muy buena', level: 'good' };
  if (rssi >= -70) return { label: 'Buena',     level: 'ok' };
  if (rssi >= -80) return { label: 'Débil',     level: 'warn' };
  return { label: 'Muy débil', level: 'bad' };
}

function standardClass(phy) {
  if (phy.includes('n')) return 'Wi-Fi 4 (n)';
  if (phy.includes('g')) return 'Legacy (b/g)';
  if (phy.includes('b')) return 'Legacy (b)';
  return 'Desconocido';
}

function enrich(aps) {
  const perSsid = {};
  for (const ap of aps) if (ap.ssid) perSsid[ap.ssid] = (perSsid[ap.ssid] || 0) + 1;
  return aps.map(ap => ({
    ...ap,
    sec: SEC[ap.auth] || { label: ap.auth, level: '', note: 'Desconocida' },
    sig: signalClass(ap.rssi),
    bw: ap.primary !== ap.channel ? 40 : 20,   // HT40 si hay canal secundario
    // ap.channel es el canal SECUNDARIO cuando usa 40 MHz; el centro queda entre ambos
    center: (ap.primary + ap.channel) / 2,
    std: standardClass(ap.phy),
    hidden: !ap.ssid,
    multi: ap.ssid ? perSsid[ap.ssid] : 1
  }));
}

/* Grupos de resumen: cada get devuelve la lista de valores del AP en ese grupo */
const GROUPS = [
  { key: 'sec',  title: 'Seguridad',      get: a => [a.sec.label], level: a => a.sec.level },
  { key: 'sig',  title: 'Señal',          get: a => [a.sig.label], level: a => a.sig.level },
  { key: 'bw',   title: 'Ancho de canal', get: a => [a.bw + ' MHz'] },
  { key: 'std',  title: 'Estándar',       get: a => [a.std] },
  { key: 'flag', title: 'Notas',          get: a => [a.hidden ? 'Oculta' : null, a.multi > 1 ? 'Multi-AP' : null].filter(Boolean) }
];

/* ---------------- Estado y render ---------------- */
let last = null;      // respuesta cruda del ESP32
let aps = [];         // redes ya clasificadas
let filter = null;    // { key, value } o null

function levelOf(group, value) {
  if (!group.level) return '';
  const ap = aps.find(a => group.get(a).includes(value));
  return ap ? group.level(ap) : '';
}

function renderSummary() {
  const box = $('summary');
  box.replaceChildren();
  for (const g of GROUPS) {
    const counts = {};
    for (const a of aps) for (const v of g.get(a)) counts[v] = (counts[v] || 0) + 1;
    const entries = Object.entries(counts).sort((x, y) => y[1] - x[1]);
    if (!entries.length) continue;

    const div = document.createElement('div');
    div.className = 'group';
    const h = document.createElement('h2');
    h.textContent = g.title;
    const chips = document.createElement('div');
    chips.className = 'chips';

    for (const [value, n] of entries) {
      const b = document.createElement('button');
      b.className = 'chip ' + levelOf(g, value);
      if (filter && filter.key === g.key && filter.value === value) b.classList.add('active');
      b.textContent = `${value} · ${n}`;
      b.title = 'Clic para filtrar';
      b.addEventListener('click', () => {
        const same = filter && filter.key === g.key && filter.value === value;
        filter = same ? null : { key: g.key, value };
        render();
      });
      chips.appendChild(b);
    }
    div.append(h, chips);
    box.appendChild(div);
  }
}

function badge(text, level, title) {
  const s = document.createElement('span');
  s.className = 'badge ' + (level || '');
  s.textContent = text;
  if (title) s.title = title;
  return s;
}

function signalCell(ap) {
  const wrap = document.createElement('span');
  const m = document.createElement('span');
  m.className = 'meter ' + ap.sig.level;
  const i = document.createElement('i');
  const pct = Math.max(0, Math.min(100, ((ap.rssi + 100) / 60) * 100));
  i.style.width = pct + '%';
  m.appendChild(i);
  wrap.append(m, badge(ap.sig.label, ap.sig.level));
  return wrap;
}

function renderRows() {
  const tbody = $('rows');
  tbody.replaceChildren();
  const group = filter ? GROUPS.find(g => g.key === filter.key) : null;
  const visible = filter ? aps.filter(a => group.get(a).includes(filter.value)) : aps;

  for (const ap of visible) {
    const tr = document.createElement('tr');
    const notes = [];
    if (ap.hidden) notes.push('Oculta');
    if (ap.multi > 1) notes.push(`Multi-AP (${ap.multi})`);

    const cells = [
      [ap.ssid || '<OCULTO>', ap.hidden ? 'muted' : ''],
      [ap.bssid, ''],
      [`${ap.primary}(${ap.channel})`, 'num'],
      [`${ap.rssi} dBm`, 'num'],
      [signalCell(ap), ''],
      [badge(ap.sec.label, ap.sec.level, ap.sec.note), ''],
      [`${ap.bw} MHz`, 'num'],
      [ap.std, ''],
      [notes.join(', '), 'muted']
    ];
    for (const [content, cls] of cells) {
      const td = document.createElement('td');
      if (typeof content === 'string') td.textContent = content;
      else td.appendChild(content);
      if (cls) td.className = cls;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  return visible.length;
}

function render() {
  renderSummary();
  renderCongestion();
  renderStats();
  const shown = renderRows();
  let msg = `Total: ${last.total} (mostrando ${last.shown})`;
  if (filter) msg += ` · Filtro: ${filter.value} (${shown} redes)`;
  $('status').textContent = msg;
}

/* ---------------- Análisis de congestión (2.4 GHz) ---------------- */
const CHANNELS = Array.from({ length: 13 }, (_, i) => i + 1);
const REC_CHANNELS = [1, 6, 11];   // los tres canales que no se solapan entre sí
const SVGNS = 'http://www.w3.org/2000/svg';

/* Qué fracción de un canal de 20 MHz queda tapada por esta red.
   Los canales están separados 5 MHz; ap.center es el centro del bloque que ocupa. */
function overlapFraction(ap, ch) {
  const apLo = ap.center * 5 - ap.bw / 2, apHi = ap.center * 5 + ap.bw / 2;
  const chLo = ch * 5 - 10, chHi = ch * 5 + 10;
  return Math.max(0, Math.min(apHi, chHi) - Math.max(apLo, chLo)) / 20;
}

/* Peso por potencia: -95 dBm o menos no cuenta, -45 dBm o más pesa 1 */
function signalWeight(rssi) {
  return Math.max(0, Math.min(1, (rssi + 95) / 50));
}

function congestionLevel(score) {
  if (score < 25) return { label: 'Libre',    level: 'good' };
  if (score < 50) return { label: 'Moderada', level: 'ok' };
  if (score < 75) return { label: 'Alta',     level: 'warn' };
  return                 { label: 'Saturada', level: 'bad' };
}

function analyzeCongestion(list) {
  return CHANNELS.map(ch => {
    let load = 0;
    for (const ap of list) load += overlapFraction(ap, ch) * signalWeight(ap.rssi);
    const score = Math.min(100, Math.round(load * 25));   // ~4 redes fuertes = saturado
    return {
      ch, score, ...congestionLevel(score),
      count: list.filter(ap => ap.primary === ch).length
    };
  });
}

function svgEl(name, attrs, text) {
  const e = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderCongestion() {
  const box = $('congestion');
  const res = analyzeCongestion(aps);
  const best = REC_CHANNELS.map(c => res[c - 1]).reduce((a, b) => (b.score < a.score ? b : a));

  box.replaceChildren();
  box.hidden = false;
  const h = document.createElement('h2');
  h.textContent = 'Congestión por canal (2.4 GHz)';
  box.appendChild(h);

  /* Gráfica de barras: una por canal, con su puntaje de 0 a 100 */
  const W = 650, H = 230, base = 170, maxH = 130, x0 = 36, step = 46, bw = 34;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Congestión por canal' });

  for (const g of [0, 25, 50, 75, 100]) {
    const y = base - (g / 100) * maxH;
    svg.appendChild(svgEl('line', { x1: x0 - 6, x2: W - 10, y1: y, y2: y, stroke: 'currentColor', 'stroke-opacity': 0.15 }));
    svg.appendChild(svgEl('text', { x: x0 - 10, y: y + 4, 'text-anchor': 'end', 'font-size': 10, fill: 'currentColor', opacity: 0.6 }, g));
  }

  res.forEach((r, i) => {
    const x = x0 + i * step + 4;
    const cx = x + bw / 2;
    const barH = Math.max(2, (r.score / 100) * maxH);
    const isRec = REC_CHANNELS.includes(r.ch);

    svg.appendChild(svgEl('rect', {
      x, y: base - barH, width: bw, height: barH, rx: 4,
      fill: `var(--${r.level})`, 'fill-opacity': isRec ? 1 : 0.6
    }));
    svg.appendChild(svgEl('text', { x: cx, y: base - barH - 5, 'text-anchor': 'middle', 'font-size': 11, fill: 'currentColor' }, r.score));
    if (r.ch === best.ch) {
      svg.appendChild(svgEl('text', { x: cx, y: base - barH - 19, 'text-anchor': 'middle', 'font-size': 13, fill: 'var(--warn)' }, '★'));
    }
    svg.appendChild(svgEl('text', {
      x: cx, y: base + 16, 'text-anchor': 'middle', 'font-size': 12,
      'font-weight': isRec ? 700 : 400, fill: 'currentColor'
    }, r.ch));
    svg.appendChild(svgEl('text', {
      x: cx, y: base + 31, 'text-anchor': 'middle', 'font-size': 10, fill: 'currentColor', opacity: 0.6
    }, r.count ? `${r.count} red${r.count > 1 ? 'es' : ''}` : '–'));
  });
  box.appendChild(svg);

  /* Recomendación entre 1, 6 y 11 */
  const rec = document.createElement('div');
  rec.className = 'rec';
  const lead = document.createElement('strong');
  lead.textContent = `Canal recomendado: ${best.ch}`;
  rec.appendChild(lead);
  for (const c of REC_CHANNELS) {
    const r = res[c - 1];
    const s = document.createElement('span');
    s.className = 'badge ' + r.level;
    s.textContent = `Canal ${c}: ${r.score}/100 · ${r.label}` + (c === best.ch ? ' ★' : '');
    rec.appendChild(s);
  }
  box.appendChild(rec);

  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = 'Ocupación estimada según cuántas redes se solapan con cada canal y qué tan fuerte se oyen. ' +
    'Debajo de cada canal se indica cuántas redes lo usan como canal principal. ' +
    'Es un solo escaneo, medido desde donde está el ESP32.';
  box.appendChild(note);
}

/* ---------------- Escaneo y CSV ---------------- */
async function scan() {
  const btn = $('scan');
  btn.disabled = true;
  $('status').textContent = 'Escaneando…';
  try {
    const r = await fetch('/api/scan');
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.status);
    last = data;
    aps = enrich(data.aps);
    filter = null;
    render();
    $('csv').disabled = false;
    syncHistory();
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

function downloadCsv() {
  if (!last) return;
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = ['timestamp_ms,ssid,bssid,channel,sec_channel,rssi,auth,phy,seguridad,senal,ancho_mhz,estandar,oculta,multi_ap'];
  for (const ap of aps) {
    lines.push([
      last.timestamp_ms, q(ap.ssid || '(hidden)'), ap.bssid,
      ap.primary, ap.channel, ap.rssi, q(ap.auth), ap.phy,
      q(ap.sec.label), q(ap.sig.label), ap.bw, q(ap.std),
      ap.hidden ? 1 : 0, ap.multi
    ].join(','));
  }
  const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'redes_wifi.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------------- Historial y estadísticas ---------------- */
const PAL = ['#e6550d', '#3182bd', '#31a354', '#9467bd', '#d6a300'];
let hist = [], boot = 0, histCap = 120;

async function syncHistory() {
  if (document.hidden) return;
  try {
    const after = hist.length ? hist[hist.length - 1].seq : 0;
    const d = await (await fetch(`/api/history?after=${after}&boot=${boot}`)).json();
    if (d.reset) hist = [];
    boot = d.boot;
    histCap = d.cap || 120;
    $('auto').value = String(d.interval);
    for (const sn of d.snaps) hist.push({ ...sn, aps: enrich(sn.aps) });
    while (hist.length > histCap) hist.shift();
    $('histInfo').textContent = `Historial: ${hist.length}/${d.cap} escaneos${d.psram ? ' (PSRAM)' : ''}`;
    if (d.snaps.length) {
      last = hist[hist.length - 1];
      aps = last.aps;
      $('csv').disabled = false;
      render();
    }
  } catch (e) { /* el ESP32 está escaneando; se reintenta en el próximo ciclo */ }
}

function fmtAgo(ms) {
  const s = Math.round(ms / 1000);
  return s === 0 ? 'ahora' : s < 60 ? `-${s}s` : `-${Math.floor(s / 60)}m ${s % 60}s`;
}

/* Gráfica de líneas genérica: series = [{ name, color, pts: [valor | null] }] */
function lineChart(title, xs, series, ymin, ymax, yticks) {
  const W = 650, H = 210, L = 40, R = 10, T = 10, B = 28, pw = W - L - R, ph = H - T - B;
  const t0 = xs[0], t1 = xs[xs.length - 1], span = Math.max(1, t1 - t0);
  const X = i => L + (xs.length > 1 ? ((xs[i] - t0) / span) * pw : pw / 2);
  const Y = v => T + (1 - (v - ymin) / (ymax - ymin)) * ph;

  const div = document.createElement('div');
  div.className = 'group';
  const h = document.createElement('h2');
  h.textContent = title;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': title });

  for (const g of yticks) {
    svg.appendChild(svgEl('line', { x1: L, x2: W - R, y1: Y(g), y2: Y(g), stroke: 'currentColor', 'stroke-opacity': 0.15 }));
    svg.appendChild(svgEl('text', { x: L - 6, y: Y(g) + 4, 'text-anchor': 'end', 'font-size': 10, fill: 'currentColor', opacity: 0.6 }, g));
  }
  for (const f of [0, 0.5, 1]) {
    svg.appendChild(svgEl('text', {
      x: L + f * pw, y: H - 8, 'font-size': 10, fill: 'currentColor', opacity: 0.6,
      'text-anchor': f === 0 ? 'start' : f === 1 ? 'end' : 'middle'
    }, fmtAgo(t1 - (t0 + f * span))));
  }
  for (const sr of series) {
    let d = '', pen = false;
    sr.pts.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)} `;
      pen = true;
      svg.appendChild(svgEl('circle', { cx: X(i), cy: Y(v), r: 2.2, fill: sr.color }));
    });
    svg.insertBefore(svgEl('path', { d, fill: 'none', stroke: sr.color, 'stroke-width': 2 }), svg.lastChild);
  }

  const legend = document.createElement('div');
  legend.className = 'legend';
  for (const sr of series) {
    const item = document.createElement('span');
    const sw = document.createElement('i');
    sw.className = 'sw';
    sw.style.background = sr.color;
    item.append(sw, sr.name);
    legend.appendChild(item);
  }
  div.append(h, svg, legend);
  return div;
}

function renderStats() {
  const box = $('stats');
  if (!hist.length) return;
  box.hidden = false;
  box.replaceChildren();
  const xs = hist.map(x => x.timestamp_ms);

  // 1) RSSI en el tiempo de las 5 redes (BSSID) con mejor señal promedio
  const stat = {};
  for (const x of hist) for (const a of x.aps) {
    const e = (stat[a.bssid] ||= { name: `${a.ssid || '<OCULTO>'} (${a.bssid.slice(-5)})`, sum: 0, n: 0 });
    e.sum += a.rssi; e.n++;
  }
  const top = Object.entries(stat).sort((p, q) => q[1].sum / q[1].n - p[1].sum / p[1].n).slice(0, 5);
  const rssi = top.map(([b, e], i) => ({
    name: e.name, color: PAL[i],
    pts: hist.map(x => { const a = x.aps.find(k => k.bssid === b); return a ? a.rssi : null; })
  }));
  box.appendChild(lineChart('Señal en el tiempo (5 redes más fuertes, dBm)', xs, rssi, -100, -30, [-100, -80, -60, -40]));

  // 2) Congestión de los canales 1, 6 y 11 en cada escaneo
  const cong = hist.map(x => analyzeCongestion(x.aps));
  const cs = REC_CHANNELS.map((c, i) => ({ name: `Canal ${c}`, color: PAL[i], pts: cong.map(r => r[c - 1].score) }));
  box.appendChild(lineChart('Congestión en el tiempo (0-100)', xs, cs, 0, 100, [0, 25, 50, 75, 100]));
}

$('auto').addEventListener('change', e => fetch('/api/auto?interval=' + e.target.value, { method: 'POST' }));
